name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi
      continue-on-error: true

    - name: Run tests
      run: npm test --if-present || echo "No tests configured"
      continue-on-error: true

    - name: Build
      run: npm run build --if-present || echo "No build script configured"
      continue-on-error: true

    - name: Get version
      id: package-version
      run: |
        if [ -f "package.json" ]; then
          echo "version=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT
        else
          echo "version=0.0.0" >> $GITHUB_OUTPUT
        fi

    - name: Check Firebase credentials
      id: check-firebase
      run: |
        if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
          echo "::warning::Firebase token not configured. Skipping Firebase deployment."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Deploy to Firebase
      if: steps.check-firebase.outputs.skip != 'true'
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only hosting
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      continue-on-error: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        tag_name: v${{ steps.package-version.outputs.version }}
        name: Release v${{ steps.package-version.outputs.version }}
        draft: false
        prerelease: false
      continue-on-error: true

    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: 'Deployment ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true

    - name: Trigger dependent repos
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository_owner }}/ai-workflow-architect/dispatches \
          -d '{"event_type":"dependency-update","client_payload":{"source":"forgemind-ai"}}' || true

        curl -X POST \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository_owner }}/shopify-command-center/dispatches \
          -d '{"event_type":"dependency-update","client_payload":{"source":"forgemind-ai"}}' || true
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      continue-on-error: true

    - name: Skip notice
      if: steps.check-firebase.outputs.skip == 'true'
      run: echo "Firebase deployment skipped - FIREBASE_TOKEN secret not configured."
